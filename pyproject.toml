[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defense-assistant"
version = "0.2.0"
description = "국방 특화 생성형 AI 비서 (Defense-domain generative AI assistant built on Claude)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.11.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx2"]

[project.scripts]
defense-ai = "defense_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["defense_assistant*"]

[tool.setuptools.package-data]
defense_assistant = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
